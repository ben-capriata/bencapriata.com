<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D3B3C">
  <title>Page not found | Ben Capriata</title>
  <style>
    :root{color-scheme:dark;--sea:#0D3B3C;--ink:#06222A;--papaya:#FF7A38;--chalk:#EEF0E9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:var(--sea);color:var(--chalk);font-family:system-ui,sans-serif}
    main{width:min(100%,52rem)}
    p{margin:0 0 1rem;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
    h1{margin:0 0 2rem;font-size:clamp(3rem,12vw,8rem);line-height:.9;text-transform:uppercase;letter-spacing:-.04em}
    a{display:inline-block;color:var(--chalk);font-weight:700;text-decoration:none;border-bottom:3px solid var(--papaya);padding-bottom:.25rem}
    a:focus-visible{outline:3px solid var(--papaya);outline-offset:6px}
  </style>
</head>
<body>
  <main>
    <p>404 / Lost record</p>
